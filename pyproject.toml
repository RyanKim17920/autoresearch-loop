[project]
name = "autoresearch-loop"
version = "0.1.0"
description = "An LLM-driven autonomous research loop: proposes, implements, runs and judges ML training experiments on SLURM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.115.1",
    "claude-agent-sdk>=0.2.110",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/loop"]
addopts = "--confcutdir=tests/loop"
